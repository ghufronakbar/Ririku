name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ririku is a multipurpose notch app built around music controls and synced lyrics.
        Please read the scope section in [CONTRIBUTING.md](https://github.com/ghufronakbar/Ririku/blob/main/CONTRIBUTING.md#project-scope) and the [roadmap](https://github.com/ghufronakbar/Ririku/blob/main/docs/roadmap.md) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Ririku to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays within the project scope (no downloads, DRM bypass, embedded web browser, or new online service) and needs no paid service
          required: true
