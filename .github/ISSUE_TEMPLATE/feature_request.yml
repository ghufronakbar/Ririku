name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Ririku focuses on music controls and synced lyrics in a native notch panel.
        Please read the scope section in [CONTRIBUTING.md](https://github.com/lanstheprodigy/ririku/blob/main/CONTRIBUTING.md#project-scope) first.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like Ririku to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This stays within the project scope (no downloads, DRM bypass, or general desktop utilities) and needs no paid service
          required: true
