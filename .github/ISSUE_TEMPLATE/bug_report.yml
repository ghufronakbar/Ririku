name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. You can write in English, Bahasa Indonesia, or Japanese.
        Please do not paste cookies, tokens, or personal browsing data.
  - type: checkboxes
    id: checked
    attributes:
      label: Before reporting
      options:
        - label: I checked the [troubleshooting section](https://github.com/ghufronakbar/Ririku/blob/main/docs/user-guide.md#troubleshooting)
          required: true
        - label: I searched existing issues
          required: true
  - type: textarea
    id: what-happens
    attributes:
      label: What happens
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        1. Play a song on YouTube Music
        2. Hover over the notch
        3. The panel shows the previous song
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Ririku version
      description: Shown in Setup under Prototype (for example 0.3.0), or the commit you built.
    validations:
      required: true
  - type: input
    id: extension-version
    attributes:
      label: Extension version
      description: Shown in Setup → Chrome connection, step 4, or in chrome://extensions.
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model
      placeholder: macOS 15.7, MacBook Pro M3
    validations:
      required: true
  - type: input
    id: chrome
    attributes:
      label: Chrome version
      placeholder: Chrome 141
  - type: dropdown
    id: site
    attributes:
      label: Where does it happen?
      multiple: true
      options:
        - YouTube
        - YouTube Music
        - Local demo (no Chrome)
        - Not related to playback
    validations:
      required: true
  - type: input
    id: song
    attributes:
      label: Song and artist (for lyrics problems)
      description: Also mention whether Setup → Lyrics found a version, and the status it shows.
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Screenshots, error messages from Setup, or output from running the app in Terminal.
