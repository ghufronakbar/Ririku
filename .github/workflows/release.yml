name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build (for example v0.3.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and draft release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ inputs.tag || github.ref_name }}"
          version="${tag#v}"
          expected=$(sed -n 's/.*"CFBundleShortVersionString": "\([^"]*\)".*/\1/p' scripts/build-app.sh)
          if [ "$version" != "$expected" ]; then
            echo "Tag $tag does not match the version in scripts/build-app.sh ($expected)" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Check version, translations, and documentation
        run: |
          /usr/bin/python3 scripts/check-version.py
          /usr/bin/python3 scripts/check-localization.py
          /usr/bin/python3 scripts/check-docs.py

      - name: Build and sign ad hoc
        run: |
          bash scripts/build-app.sh
          codesign --verify --deep --strict "build/Ririku.app"

      - name: Package
        working-directory: build
        run: |
          ditto -c -k --keepParent "Ririku.app" "Ririku-${{ steps.version.outputs.version }}.zip"
          shasum -a 256 "Ririku-${{ steps.version.outputs.version }}.zip" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Write release notes
        run: /usr/bin/python3 scripts/release-notes.py "${{ steps.version.outputs.version }}" | tee build/release-notes.md

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            --draft \
            --title "Ririku ${{ steps.version.outputs.version }}" \
            --notes-file build/release-notes.md \
            "build/Ririku-${{ steps.version.outputs.version }}.zip" \
            "build/SHA256SUMS.txt"
