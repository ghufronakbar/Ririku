name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          sw_vers
          swift --version
          node --version

      - name: Check version consistency
        run: /usr/bin/python3 scripts/check-version.py

      - name: Check interface translations
        run: /usr/bin/python3 scripts/check-localization.py

      - name: Check documentation
        run: /usr/bin/python3 scripts/check-docs.py

      - name: Check extension syntax
        run: |
          for file in extension/*.js; do node --check "$file"; done
          for file in extension/manifest.json extension/_locales/*/messages.json; do
            /usr/bin/python3 -m json.tool "$file" > /dev/null
          done
          plutil -lint Localization/*/Localizable.strings

      - name: Run tests
        run: |
          swift test
          node --test Tests/Extension/*.test.cjs

      - name: Build app bundle
        run: bash scripts/build-app.sh

      - name: Verify code signature
        run: codesign --verify --deep --strict "build/Ririku.app"

      - name: Check bundle contents
        run: |
          plutil -p "build/Ririku.app/Contents/Info.plist"
          test -x "build/Ririku.app/Contents/MacOS/Ririku"
          test -x "build/Ririku.app/Contents/Resources/RirikuHost"
          test -f "build/Ririku.app/Contents/Resources/ChromeExtension/manifest.json"
          for language in en id ja; do
            test -d "build/Ririku.app/Contents/Resources/$language.lproj"
          done

      - name: Package for download
        working-directory: build
        run: ditto -c -k --keepParent "Ririku.app" "Ririku.zip"

      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: Ririku-${{ github.sha }}
          path: build/Ririku.zip
          retention-days: 7
